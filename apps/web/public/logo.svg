<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">TOCAFY</title>
  <desc id="desc">Logo vetorial da plataforma de música TOCAFY, com símbolo verde de ondas sonoras e nome em branco.</desc>

  <defs>
    <linearGradient id="brandGreen" x1="48" y1="38" x2="252" y2="262" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38EE83"/>
      <stop offset="1" stop-color="#0BBE59"/>
    </linearGradient>
    <linearGradient id="shine" x1="74" y1="54" x2="216" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="20" y="20" width="280" height="280" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feOffset in="blur" dy="10" result="offsetBlur"/>
      <feFlood flood-color="#00A84E" flood-opacity="0.24" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo intencionalmente transparente -->
  <g filter="url(#softShadow)">
    <rect x="50" y="40" width="220" height="220" rx="72" fill="url(#brandGreen)"/>
    <rect x="50" y="40" width="220" height="220" rx="72" fill="url(#shine)"/>
    <rect x="51.5" y="41.5" width="217" height="217" rx="70.5" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"/>
  </g>

  <!-- Ondas sonoras: formas arredondadas, balanceadas e totalmente vetoriais -->
  <rect x="93" y="119" width="19" height="62" rx="9.5" fill="white" fill-opacity="0.92"/>
  <rect x="126" y="84" width="21" height="132" rx="10.5" fill="white"/>
  <rect x="161" y="104" width="21" height="92" rx="10.5" fill="white"/>
  <rect x="196" y="67" width="21" height="166" rx="10.5" fill="white"/>
  <rect x="231" y="126" width="13" height="48" rx="6.5" fill="white" fill-opacity="0.72"/>

  <!-- Wordmark -->
  <g aria-label="TOCAFY" fill="white">
    <path d="M340 94H463V124H419V211H384V124H340V94Z"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M529 90C490 90 463 115 463 153C463 191 490 216 529 216C568 216 595 191 595 153C595 115 568 90 529 90ZM529 120C547 120 559 133 559 153C559 173 547 186 529 186C511 186 499 173 499 153C499 133 511 120 529 120Z"/>
    <path d="M674 90C702 90 723 101 737 120L710 139C702 127 691 120 676 120C655 120 642 133 642 153C642 173 655 186 676 186C691 186 702 179 710 167L737 186C723 205 702 216 674 216C633 216 606 191 606 153C606 115 633 90 674 90Z"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M793 94H830L883 211H846L838 190H783L775 211H739L793 94ZM810.5 123L793.5 164H827.5L810.5 123Z"/>
    <path d="M891 94H994V124H926V143H987V172H926V211H891V94Z"/>
    <path d="M991 94H1031L1061 138L1091 94H1131L1079 169V211H1043V169L991 94Z"/>
  </g>

  <!-- Assinatura visual no Y -->
  <path d="M1091 94H1131L1079 169V211H1043V198L1091 94Z" fill="#31E97C"/>
</svg>

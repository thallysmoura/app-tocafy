<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ícone TOCAFY</title>
  <desc id="desc">Ícone vetorial verde da TOCAFY com cinco ondas sonoras brancas.</desc>

  <defs>
    <linearGradient id="brandGreen" x1="68" y1="62" x2="452" y2="462" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38EE83"/>
      <stop offset="1" stop-color="#0BBE59"/>
    </linearGradient>
    <linearGradient id="shine" x1="98" y1="76" x2="390" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="12" y="12" width="488" height="488" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur"/>
      <feOffset in="blur" dy="14" result="offsetBlur"/>
      <feFlood flood-color="#00A84E" flood-opacity="0.26" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo externo transparente -->
  <g filter="url(#softShadow)">
    <rect x="56" y="46" width="400" height="400" rx="130" fill="url(#brandGreen)"/>
    <rect x="56" y="46" width="400" height="400" rx="130" fill="url(#shine)"/>
    <rect x="59" y="49" width="394" height="394" rx="127" stroke="#FFFFFF" stroke-opacity="0.17" stroke-width="6"/>
  </g>

  <!-- Ondas sonoras -->
  <rect x="134" y="190" width="34" height="112" rx="17" fill="white" fill-opacity="0.92"/>
  <rect x="194" y="126" width="38" height="240" rx="19" fill="white"/>
  <rect x="258" y="162" width="38" height="168" rx="19" fill="white"/>
  <rect x="322" y="95" width="38" height="302" rx="19" fill="white"/>
  <rect x="386" y="202" width="24" height="88" rx="12" fill="white" fill-opacity="0.72"/>
</svg>

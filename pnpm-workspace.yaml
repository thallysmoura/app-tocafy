packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  zod: ^3.25.76
  # CVE de DoS por decompressão ilimitada — puxado transitivamente pelo
  # binário pré-compilado do bcrypt (@mapbox/node-pre-gyp), só usado no
  # install; força a versão corrigida mesmo assim.
  tar: '>=7.5.19'
allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  bigint-buffer: true
  bufferutil: true
  esbuild: true
  ffmpeg-static: true
  keccak: true
  prisma: true
  protobufjs: true
  secp256k1: true
  sharp: true
  utf-8-validate: true
  yt-dlp-exec: true

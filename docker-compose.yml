name: tocafy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tocafy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tocafy}
      POSTGRES_DB: ${POSTGRES_DB:-tocafy}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - tocafy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tocafy} -d ${POSTGRES_DB:-tocafy}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - ${MUSIC_DIR}:/music:ro
      - tocafy_covers_data:/app/covers
    environment:
      MUSIC_DIR: /music
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"require('http').get('http://localhost:3001/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    restart: unless-stopped
    env_file: .env
    environment:
      # O Docker seta HOSTNAME=<id do container> automaticamente em todo
      # container, e o server standalone do Next lê essa variável como
      # endereço pra escutar — sem isso, ele ficava ouvindo só no IP interno
      # do container, nunca em 127.0.0.1/0.0.0.0 (funcionava por acaso via
      # rede Docker, mas falhava em qualquer checagem feita de dentro dele).
      HOSTNAME: '0.0.0.0'
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:3002:3002'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"require('http').get('http://localhost:3002/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --protocol http2 --config /etc/cloudflared/config.yml run
    volumes:
      - ./.cloudflared/tunnel-config.docker.yml:/etc/cloudflared/config.yml:ro
      - ./.cloudflared/4af0465b-0012-499f-b041-83412d35fd20.json:/etc/cloudflared/creds.json:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  tocafy_postgres_data:
  tocafy_covers_data:
